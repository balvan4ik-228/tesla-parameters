services:
  minio:
    # Версия зафиксирована: в новых релизах из бесплатной консоли
    # убрали настройку прав доступа к бакету.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tesla-parameters-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:18-alpine
    container_name: tesla-parameters-postgres
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla_password
      POSTGRES_DB: tesla_parameters
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    image: adminer:latest
    container_name: tesla-parameters-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
  postgres-data:
